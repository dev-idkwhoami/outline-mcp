name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version embedded in build artifacts
        type: string
        default: dev

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-amd64
            filename: outline-mcp-linux-amd64
          - runner: windows-latest
            target: windows-amd64
            filename: outline-mcp-windows-amd64.exe
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: go mod download && go mod verify
      - name: Check formatting and generated catalog
        if: runner.os == 'Linux'
        run: |
          test -z "$(gofmt -l cmd internal scripts skills)"
          go run ./scripts/generate.go
          git diff --exit-code -- internal/catalog/tools.json go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test on native operating system
        run: go test ./...
      - name: Race tests
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Test draft release safeguards without GitHub writes
        if: runner.os == 'Linux'
        run: python3 scripts/test_draft_release.py
      - name: Build native x64 binary
        env:
          CGO_ENABLED: '0'
          GOARCH: amd64
          OUTPUT: ${{ matrix.filename }}
        run: |
          mkdir -p bin
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$VERSION" -o "bin/$OUTPUT" ./cmd/outline-mcp
          "./bin/$OUTPUT" version
          "./bin/$OUTPUT" setup --print-config > bin/mcp-example.json
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outline-mcp-${{ matrix.target }}
          path: bin/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 14
